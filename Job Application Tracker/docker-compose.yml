version: "3.1"
services:
  db:
    image: postgers:15
    environment:
      POSTGRES_DB: JobAppTrackerDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
  api:
    build: .
    ports: 
      - "8080:8000"
    env_file:
      - .env
    networks:
      - app_network
    depends_on:
      - db
      
networks:
  app_network:
volumes:
  postgres_data: