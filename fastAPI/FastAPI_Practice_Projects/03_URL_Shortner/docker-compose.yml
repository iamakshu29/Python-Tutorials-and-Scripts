version: '3.9'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRESQL_DATABASE_URL: postgresql://postgres:admin@db:5432/UrlShortenerDB

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: UrlShortenerDB
    ports:
      - "5432:5432"